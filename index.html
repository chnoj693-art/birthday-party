<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단풍 소풍 생일파티</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4e6;--panel:#fffaf2;--ink:#4a2a14;--accent:#c8441c;--line:#e8c9a4;--shadow:rgba(90,40,10,.25);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a12;--panel:#3a261a;--ink:#ffe9d2;--accent:#ff8a5c;--line:#6a4630;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#2a1a12;--panel:#3a261a;--ink:#ffe9d2;--accent:#ff8a5c;--line:#6a4630;--shadow:rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;text-align:center;pointer-events:none;font-size:20px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 12px)}
button{font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 16px;box-shadow:0 3px 0 var(--line);cursor:pointer}
button.main{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 3px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(2px);box-shadow:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,16,4,.45);padding:16px;z-index:5}
.ov.show{display:flex}
.card{width:min(420px,100%);background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 12px 40px var(--shadow)}
.card h2{margin:0 0 12px;font-size:24px;font-weight:400}
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
textarea{height:140px;resize:none}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#readText{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:14px;margin:0 0 12px;line-height:1.6;max-height:50vh;overflow:auto}
#side{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:2}#side button{font-size:15px;padding:8px 10px}
#bar{flex-wrap:wrap;gap:8px}#bar button{font-size:15px;padding:8px 12px}
#lyric{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 125px);text-align:center;font-size:26px;color:#fff;text-shadow:0 2px 6px rgba(80,20,0,.85),0 0 2px #000;pointer-events:none;padding:0 12px}
#verse{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%) translateY(-8px);width:min(420px,90vw);background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:12px 16px;text-align:center;box-shadow:0 8px 24px var(--shadow);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none;z-index:4}
#verse.show{opacity:1;transform:translateX(-50%) translateY(0)}
#verse p{margin:0 0 6px;font-size:19px;line-height:1.5;word-break:keep-all}
#verse span{font-size:14px;color:var(--accent)}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 16px;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"></div>
<div id="bar">
  <button class="main" id="bWrite">💌 편지 쓰기</button>
  <button id="bMusic">🎵 음악 끄기</button>
  <button id="bFire">🎉 폭죽</button>
  <button id="bLy">🎤 가사 끄기</button>
  <button id="bPhoto">📸 사진</button>
</div>
<div id="side"><button id="bStage">🎤 무대</button><button id="bBow">🙇 인사</button><button id="bDance">💃 댄스</button></div>
<div id="lyric"></div>
<div id="verse"><p id="vt"></p><span id="vr"></span></div>
<div id="toast"></div>

<div class="ov show" id="ovStart"><div class="card">
  <h2>🍁 단풍 소풍 생일파티</h2>
  <p style="margin:0 0 10px;line-height:1.5">강대민님의 생일 파티에 오신 걸 환영해요! 🎉</p>
  <ul style="margin:0 0 16px;padding-left:20px;line-height:1.7;font-size:16px">
    <li>화면을 끌면 둘러보고, 휠이나 두 손가락으로 확대해요</li>
    <li>💌 편지를 쓰면 선물이 되어 바닥에 놓여요</li>
    <li>선물은 끌어서 옮기고, 누르면 편지를 읽어요</li>
    <li>케이크, 새, 단풍잎도 눌러보세요</li>
  </ul>
  <div class="row"><button class="main" id="bEnter">입장하기</button></div>
</div></div>

<div class="ov" id="ovWrite"><div class="card">
  <h2>생일 축하 편지</h2>
  <input id="from" maxlength="12" placeholder="보내는 사람">
  <textarea id="msg" maxlength="300" placeholder="축하 메시지를 적어주세요"></textarea>
  <p style="margin:0 0 10px;font-size:14px;opacity:.8;line-height:1.5">보낸 편지는 선물이 되어 바닥에 놓여요. 선물은 끌어서 옮기고, 누르면 편지를 읽을 수 있어요.</p>
  <div class="row"><button id="wCancel">취소</button><button class="main" id="wSend">선물로 보내기</button></div>
</div></div>

<div class="ov" id="ovRead"><div class="card">
  <h2 id="readFrom"></h2>
  <p id="readText"></p>
  <div class="row"><button id="rDel">🗑 편지 삭제</button><button class="main" id="rClose">닫기</button></div>
</div></div>

<div class="ov" id="ovPhoto"><div class="card">
  <h2>📸 기념사진</h2>
  <img id="photo" alt="기념사진" style="width:100%;border-radius:12px;margin-bottom:8px">
  <p style="margin:0 0 12px;font-size:15px">이미지를 길게 누르거나 우클릭해서 저장하세요.</p>
  <div class="row"><button class="main" id="pClose">닫기</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== Firebase 설정: Firebase 콘솔 > 프로젝트 설정 > 내 앱 > 웹 앱의 firebaseConfig 값을 붙여넣으세요 =====
const FIREBASE_CONFIG={
  apiKey:'AIzaSyC8VPI0OaaXidi_5aNC2GcJ0TYfsbSzGJs',
  authDomain:'birthday-27050.firebaseapp.com',
  projectId:'birthday-27050',
  appId:'1:284458636217:web:39725032194d611e3fdc68'
};
// 설정을 채우지 않으면 예전처럼 이 브라우저에만 저장돼요.
const CLOUD=!FIREBASE_CONFIG.apiKey.startsWith('여기에');
let db=null,myUid=null;
function canEdit(d){return !CLOUD||d.uid===myUid;}
const $=id=>document.getElementById(id);
const T=THREE, cv=$('c');
const R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
const S=new T.Scene();
S.background=new T.Color(0xffd9a8);
S.fog=new T.Fog(0xffd9a8,22,60);
const cam=new T.PerspectiveCamera(50,1,.1,100);
S.add(new T.HemisphereLight(0xfff0d8,0x8a4a1c,.85));
const sun=new T.DirectionalLight(0xffe2b0,.9);
sun.position.set(8,14,6);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});
S.add(sun);

function M(geo,col,x,y,z,par,opt){
  const m=new T.Mesh(geo,new T.MeshLambertMaterial(Object.assign({color:col},opt||{})));
  m.position.set(x||0,y||0,z||0);m.castShadow=true;m.receiveShadow=true;
  (par||S).add(m);return m;
}
const cyl=(r,h,s)=>new T.CylinderGeometry(r,r,h,s||24);
const sph=(r)=>new T.SphereGeometry(r,16,12);

// ground & cloth
M(new T.CircleGeometry(60,48),0xb86a2e,0,0,0).rotation.x=-Math.PI/2;
const cloth=M(new T.CircleGeometry(5,48),0xd9482b,0,.02,0);cloth.rotation.x=-Math.PI/2;cloth.castShadow=false;
const cloth2=M(new T.RingGeometry(3.4,3.9,48),0xfff1d6,0,.03,0);cloth2.rotation.x=-Math.PI/2;cloth2.castShadow=false;

// trees
const leafCols=[0xd8431c,0xf08a1c,0xf2b630,0xb8321a];
for(let i=0;i<16;i++){
  const a=i/16*Math.PI*2+.2,r=15+(i%3)*3,x=Math.sin(a)*r,z=Math.cos(a)*r;
  const g=new T.Group();g.position.set(x,0,z);S.add(g);
  M(cyl(.45,4,8),0x5a3418,0,2,0,g);
  [[3.6,0,1.9],[2.7,0,3.9],[1.8,0,5.4]].forEach((s,k)=>M(new T.IcosahedronGeometry(s[0],1),leafCols[(i+k)%4],0,s[2]+2,0,g));
}

// table
const TOP=1.1;
M(cyl(2.1,.14,40),0xa8713a,0,TOP-.07,0);
M(cyl(.3,TOP,12),0x7a4a22,0,TOP/2,0);
M(cyl(.9,.1,20),0x7a4a22,0,.05,0);

// cake
const cake=new T.Group();cake.position.set(0,TOP,0);S.add(cake);
M(cyl(.5,.28,28),0xfff3df,0,.14,0,cake);
M(cyl(.36,.24,28),0xffb3c7,0,.4,0,cake);
for(let i=0;i<8;i++){const a=i/8*6.283;M(sph(.06),0xd8132a,Math.sin(a)*.5,.3,Math.cos(a)*.5,cake);}
const flames=[];
for(let i=0;i<5;i++){
  const a=i/5*6.283,x=Math.sin(a)*.22,z=Math.cos(a)*.22;
  M(cyl(.025,.2,8),[0x4aa8ff,0xffd23f,0x6ee06e,0xff7fb0,0xb58cff][i],x,.62,z,cake);
  const f=M(new T.ConeGeometry(.04,.12,8),0xffcf33,x,.78,z,cake,{emissive:0xff8a00});f.castShadow=false;flames.push(f);
}
const flameLight=new T.PointLight(0xffa844,.8,5);flameLight.position.set(0,TOP+1.5,0);S.add(flameLight);

// dishes (r=1.35)
function at(a,r){return [Math.sin(a*Math.PI/180)*r,Math.cos(a*Math.PI/180)*r];}
(function(){
  let [x,z]=at(130,1.35); // miyeokguk
  const g=new T.Group();g.position.set(x,TOP,z);S.add(g);
  M(new T.SphereGeometry(.34,20,10,0,6.283,Math.PI/2,Math.PI/2),0xf4f4f4,0,.34,0,g).material.side=T.DoubleSide;
  M(cyl(.3,.02,20),0x4a5a2a,0,.27,0,g);
  for(let i=0;i<7;i++)M(new T.BoxGeometry(.1,.015,.05),0x1e2e18,(Math.random()-.5)*.4,.285,(Math.random()-.5)*.4,g).rotation.y=Math.random()*3;
  [x,z]=at(230,1.35); // japchae
  const j=new T.Group();j.position.set(x,TOP,z);S.add(j);
  M(cyl(.45,.04,24),0xffffff,0,.02,0,j);
  const mound=M(sph(.3),0x6a3a1e,0,.05,0,j);mound.scale.y=.55;
  [0xf08a1c,0x3f8a2a,0xe0c040,0xd8432b].forEach((c,k)=>{for(let i=0;i<4;i++)M(new T.BoxGeometry(.06,.02,.04),c,Math.sin(k*4+i)*.2,.19,Math.cos(k*3+i*2)*.2,j).rotation.y=i+k;});
  [x,z]=at(0,1.4); // fish
  const f=new T.Group();f.position.set(x,TOP,z);S.add(f);
  const pl=M(cyl(.5,.04,24),0xffffff,0,.02,0,f);pl.scale.x=1.6;
  const b=M(sph(.3),0x9a8a74,0,.14,0,f);b.scale.set(1.4,.4,.55);
  const t=M(new T.ConeGeometry(.2,.28,3),0x8a7a64,.5,.14,0,f);t.rotation.z=-Math.PI/2;
  M(sph(.03),0x111111,-.3,.2,.12,f);
})();

// people
const SK=0xffd9b8, COL=[0xe8567a,0x4a8fe0,0x58b05a,0xb070e0,0xf0a030];
const people=[];
function person(a,col,role){
  const [x,z]=at(a,3);
  const g=new T.Group();g.position.set(x,0,z);g.rotation.y=Math.atan2(-x,-z);S.add(g);
  const stool=M(cyl(.3,.5,14),0x7a4a22,0,.25,0,g);
  M(cyl(.36,.95,16),col,0,.98,0,g);
  const head=new T.Group();head.position.set(0,1.68,0);g.add(head);
  M(sph(.3),SK,0,0,0,head);
  M(sph(.04),0x222222,-.11,.04,.27,head);M(sph(.04),0x222222,.11,.04,.27,head);
  const mouth=M(sph(.05),0xc83a3a,0,-.1,.28,head);
  M(sph(.05),0xff9aa8,-.2,-.06,.22,head,{transparent:true,opacity:.7});M(sph(.05),0xff9aa8,.2,-.06,.22,head,{transparent:true,opacity:.7});
  const hat=M(new T.ConeGeometry(.16,.34,12),[0xf0c030,0x4aa8ff,0xe8567a][a%3],0,.42,0,head);
  const arms=[-1,1].map(s=>{
    const p=new T.Group();p.position.set(s*.42,1.38,0);p.rotation.order='YXZ';g.add(p);
    const m=M(cyl(.08,.62,10),SK,0,-.31,0,p);return p;
  });
  const o={g,head,mouth,arms,role,x,z,a,stool};people.push(o);return o;
}
const bday=person(180,COL[0],'b');
person(108,COL[1],'p');person(252,COL[2],'p');
person(36,COL[3],'c');person(324,COL[4],'c');
// birthday person leans & rests hands on table
bday.arms.forEach(p=>p.rotation.x=-1.25);
bday.head.position.z=.14;

// confetti
const N=420,cp=new Float32Array(N*3),cc=new Float32Array(N*3),cv_=new Float32Array(N*3);
for(let i=0;i<N;i++){cp[i*3+1]=-100;}
const cg=new T.BufferGeometry();
cg.setAttribute('position',new T.BufferAttribute(cp,3));
cg.setAttribute('color',new T.BufferAttribute(cc,3));
const confetti=new T.Points(cg,new T.PointsMaterial({size:.16,vertexColors:true}));
confetti.frustumCulled=false;S.add(confetti);
let cIdx=0;
function burst(o){
  const ux=-o.x/3,uz=-o.z/3,col=new T.Color();
  for(let k=0;k<60;k++){
    const i=cIdx++%N;
    cp[i*3]=o.x+ux*.7;cp[i*3+1]=2;cp[i*3+2]=o.z+uz*.7;
    cv_[i*3]=ux*(2+Math.random()*2)+(Math.random()-.5)*2.2;
    cv_[i*3+1]=4+Math.random()*3;
    cv_[i*3+2]=uz*(2+Math.random()*2)+(Math.random()-.5)*2.2;
    col.setHSL(Math.random(),.9,.6);cc[i*3]=col.r;cc[i*3+1]=col.g;cc[i*3+2]=col.b;
  }
  cg.attributes.color.needsUpdate=true;
}

// falling maple leaves
const star=new T.Shape();
for(let i=0;i<10;i++){const r=i%2?.07:.19,a=i/10*6.283;i?star.lineTo(Math.sin(a)*r,Math.cos(a)*r):star.moveTo(0,r);}
const leafGeo=new T.ShapeGeometry(star);
const leaves=[];
for(let i=0;i<110;i++){
  const m=new T.Mesh(leafGeo,new T.MeshBasicMaterial({color:leafCols[i%4],side:T.DoubleSide}));
  m.userData={sx:Math.random()*40-20,sz:Math.random()*40-20,y:Math.random()*14,sp:.4+Math.random()*.7,ph:Math.random()*6,rs:Math.random()*2+1};
  m.scale.setScalar(1.8);S.add(m);leaves.push(m);
}

// gifts
let gifts=[];const giftObjs=new Map();
const pastel=[0xff8fa8,0x7ab8ff,0x8fe08f,0xc59cff,0xffc060,0x66d6d0];
if(!CLOUD){try{gifts=JSON.parse(localStorage.getItem('bday-gifts')||'[]');if(!Array.isArray(gifts))gifts=[];}catch(e){gifts=[];}}
function save(){if(CLOUD)return;try{localStorage.setItem('bday-gifts',JSON.stringify(gifts));}catch(e){}}
function spot(n){let k=n,x=5,z=5;for(let i=0;i<20;i++,k++){const a=(k*137.5)*Math.PI/180,r=5.6+(k%3)*.9;x=Math.sin(a)*r;z=Math.cos(a)*r;if(Math.hypot(x,z+6.3)>2.9)break;}return [x,z];}
function addGift(d,drop){
  const g=new T.Group(),c=pastel[d.c%6];
  M(new T.BoxGeometry(.7,.55,.7),c,0,.275,0,g);
  M(new T.BoxGeometry(.74,.58,.14),0xfff3c0,0,.275,0,g);
  M(new T.BoxGeometry(.14,.58,.74),0xfff3c0,0,.275,0,g);
  const b1=M(sph(.1),0xfff3c0,-.08,.65,0,g),b2=M(sph(.1),0xfff3c0,.08,.65,0,g);
  const [x,z]=d.x!==undefined?[d.x,d.z]:spot(d.n);g.position.set(x,0,z);g.rotation.y=d.n;
  g.userData={id:d.id,t:drop?0:9,drop};
  if(drop){g.position.y=7;g.scale.setScalar(.01);}
  S.add(g);giftObjs.set(d.id,g);
}
let counter=gifts.reduce((m,d)=>Math.max(m,d.n+1),0);
gifts.forEach(d=>addGift(d,false));

// UI
let nameTxt='강대민';
function setTop(){$('top').textContent='🎂 '+nameTxt+'님, 생일 축하해요! · 선물 '+gifts.length+'개 · 🍁'+score;}
function toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800);}
const show=(id,v)=>$(id).classList.toggle('show',v);
$('bWrite').onclick=()=>show('ovWrite',true);
$('wCancel').onclick=()=>show('ovWrite',false);
$('wSend').onclick=()=>{
  const text=$('msg').value.trim();
  if(!text){toast('편지 내용을 적어주세요');return;}
  const d={id:'g'+Date.now(),from:$('from').value.trim().slice(0,12)||'익명',text:text.slice(0,300),c:Math.floor(Math.random()*6),n:CLOUD?Math.floor(Math.random()*1000):counter++};
  const p=spot(d.n+Math.floor(Math.random()*500));d.x=p[0];d.z=p[1];
  if(CLOUD){
    if(!myUid){toast('연결 중이에요. 잠시 후 다시 시도해 주세요');return;}
    db.collection('letters').add({from:d.from,text:d.text,c:d.c,n:d.n,x:d.x,z:d.z,uid:myUid,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>toast('저장에 실패했어요'));
  }else{gifts.push(d);save();addGift(d,true);setTop();}
  $('msg').value='';show('ovWrite',false);toast('편지가 선물로 변신했어요! 끌어서 옮길 수 있어요 🎁');
};
let openId=null;
function openGift(id){
  const d=gifts.find(x=>x.id===id);if(!d)return;
  openId=id;$('rDel').style.display=canEdit(d)?'':'none';$('readFrom').textContent='💌 '+d.from+'님의 편지';$('readText').textContent=d.text;show('ovRead',true);
}
$('rClose').onclick=()=>show('ovRead',false);
$('rDel').onclick=()=>{
  if(!confirm('이 편지를 삭제할까요? 선물도 함께 사라져요.'))return;
  if(CLOUD){db.collection('letters').doc(openId).delete().catch(()=>toast('삭제에 실패했어요'));show('ovRead',false);toast('편지를 삭제했어요');return;}
  gifts=gifts.filter(x=>x.id!==openId);save();
  const o=giftObjs.get(openId);if(o){S.remove(o);giftObjs.delete(openId);}
  show('ovRead',false);setTop();toast('편지를 삭제했어요');
};

let ctx,master,musicOn=true,loopT;
const F={G4:392,A4:440,B4:494,C5:523,D5:587,E5:659,F5:698,G5:784};
const song=[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
function play(){
  if(!ctx)return;const beat=.5;let t=ctx.currentTime+.1;
  lyT.forEach(clearTimeout);
  lyT=[['생일 축하합니다',0],['생일 축하합니다',3],['사랑하는 강대민님',6],['생일 축하합니다',9.5],['',12.7]].map(([s,d])=>setTimeout(()=>showLy(s),(d+.1)*1000));
  song.forEach(([n,d])=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle';o.frequency.value=F[n];
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.03);
    g.gain.exponentialRampToValueAtTime(.001,t+d*beat*.95);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d*beat);t+=d*beat;
  });
  loopT=setTimeout(play,(t-ctx.currentTime+1.2)*1000);
}
function startMusic(){
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=.22;master.connect(ctx.destination);
    if(ctx.state==='suspended')ctx.resume();play();
  }catch(e){}
}

  musicOn=!musicOn;
  if(musicOn){startMusic();}else{clearTimeout(loopT);lyT.forEach(clearTimeout);showLy('');try{master.disconnect();}catch(e){}}

let th=0,ph=1.0,rad=11;const tgt=new T.Vector3(0,1.3,0);
function place(){
  cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th));

const ptrs=new Map();let moved=0,pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pd=ptrs.size>1?dist():0;dragG=ptrs.size===1?hitGift(e.clientX,e.clientY):null;});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
  if(dragG){if(moved>8)dragMove(e.clientX,e.clientY);return;}
  if(ptrs.size===1){th-=dx*.006;ph=Math.min(1.45,Math.max(.3,ph-dy*.005));}
  else{const d=dist();rad=Math.min(22,Math.max(4,rad*pd/d));pd=d;}
});
function dist(){const a=[...ptrs.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1;}
cv.addEventListener('pointerup',e=>{
  const wasOne=ptrs.size===1;ptrs.delete(e.pointerId);
  if(dragG&&moved>=8){dropG();}else if(wasOne&&moved<8)pick(e.clientX,e.clientY);
  dragG=null;
});

    if(bs==='go'&&bz<=SZ){bz=SZ;bs='stage';bsub='idle';startWant();}
    if(bs==='back'&&bz>=bd.z){bz=bd.z;bs='seat';sit();}
    return;
  }
  g.position.set(bd.x,SH,SZ);g.rotation.x=0;g.rotation.z=0;legs.forEach(l=>l.rotation.x=0);
  if(bsub==='idle'){turnTo(0,dt);spotL.color.set(0xfff0c0);A.forEach(p=>p.rotation.set(0,0,0));g.rotation.z=Math.sin(t*1.5)*.02;}
  else if(bsub==='bow'){
    const k=t-bt0;turnTo(0,dt);
    g.rotation.x=Math.sin(Math.min(1,k/2.4)*Math.PI)*.95;A.forEach(p=>p.rotation.set(.3,0,0));
    thx.visible=k<3.6;thx.position.set(0,SH+3.4,SZ);
    if(k>3.6)bsub='idle';
  }else{
    const k=t-bt0,m=Math.floor(k/2.4),s=Math.sin(t*8);
    if(m>=4){bsub='idle';return;}
    spotL.color.setHSL((t*.6)%1,.8,.7);
    if(m===0){A[0].rotation.set(0,0,-(1.3+.4*s));A[1].rotation.set(0,0,1.3-.4*s);g.rotation.z=s*.08;}
    else if(m===1){g.position.y=SH+Math.abs(Math.sin(t*6))*.4;A[0].rotation.set(Math.PI,0,-.3);A[1].rotation.set(Math.PI,0,.3);}
    else if(m===2){const s2=Math.sin(t*6);g.rotation.z=s2*.18;A[0].rotation.set(-1.2+s2*.4,0,0);A[1].rotation.set(-1.2-s2*.4,0,0);legs[0].rotation.x=s2*.4;legs[1].rotation.x=-s2*.4;}
    else{g.rotation.y+=dt*8;A[0].rotation.set(0,0,-1.4);A[1].rotation.set(0,0,1.4);}
  }
}
const stBtn=$('bStage');
stBtn.onclick=()=>{if(bs==='seat'||bs==='back'){toStage();stBtn.textContent='🪑 자리';}else{toSeat();stBtn.textContent='🎤 무대';}};
$('bBow').onclick=()=>{toStage('bow');stBtn.textContent='🪑 자리';};
$('bDance').onclick=()=>{toStage('dance');stBtn.textContent='🪑 자리';};

// loop
const clock=new T.Clock();let nextBurst=1,blowT=0;
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  // leaves
  leaves.forEach(m=>{const u=m.userData;u.y-=dt*u.sp;
    if(u.y<.05){u.y=14;u.sx=Math.random()*40-20;u.sz=Math.random()*40-20;}
    m.position.set(u.sx+Math.sin(t*.8+u.ph)*1.5,u.y,u.sz+Math.cos(t*.6+u.ph)*1.2);
    m.rotation.set(t*u.rs+u.ph,t*u.rs*.7,t*.5);});
  // people
  people.forEach(o=>{
    if(o.role==='c'){const k=.62+Math.abs(Math.sin(t*7+o.a))*.2;
      o.arms[0].rotation.set(-1.4,k,0);o.arms[1].rotation.set(-1.4,-k,0);o.head.rotation.z=Math.sin(t*3.5+o.a)*.06;}
    if(o.role==='p'){const s=Math.sin(t*10+o.a)*.05;
      o.arms[0].rotation.set(-2.3+s,.2,0);o.arms[1].rotation.set(-2.3-s,-.2,0);o.head.rotation.x=-.15;}
    if(o.role==='b')bdayAnim(t,dt);
  });
  // blow cycle: 7s period, blow for 1.6s
  const ph7=t%7,blowing=(t-wishT<4)||(ph7>4.5&&ph7<6.1);
  if(bs==='seat'){bday.head.rotation.x=blowing?.25:0;bday.mouth.scale.setScalar(blowing?1.6+Math.sin(t*20)*.2:1);}
  flames.forEach((f,i)=>{
    const fl=blowing?.25:1+Math.sin(t*14+i*2)*.15;
    f.scale.set(blowing?1.2:1,fl,1);f.rotation.z=blowing?-.8:Math.sin(t*9+i)*.08;
  });
  flameLight.intensity=blowing?.2:.7+Math.sin(t*15)*.12;
  // confetti
  if(t>nextBurst){people.filter(o=>o.role==='p').forEach(burst);nextBurst=t+2.6;}
  for(let i=0;i<N;i++){
    if(cp[i*3+1]<-50)continue;
    cv_[i*3+1]-=7*dt;cv_[i*3]*=.99;cv_[i*3+2]*=.99;
    cp[i*3]+=cv_[i*3]*dt;cp[i*3+1]+=cv_[i*3+1]*dt;cp[i*3+2]+=cv_[i*3+2]*dt;
    if(cp[i*3+1]<.05){cp[i*3+1]=.05;cv_[i*3]=cv_[i*3+1]=cv_[i*3+2]=0;}
  }
  cg.attributes.position.needsUpdate=true;
  // gift drop
  giftObjs.forEach(g=>{const u=g.userData;if(!u.drop||u.t>=1)return;
    u.t=Math.min(1,u.t+dt*.8);const e=u.t;
    g.scale.setScalar(Math.max(.01,Math.min(1,e*2)));
    g.position.y=Math.abs(Math.cos(e*Math.PI*2.5))*7*(1-e)*(1-e);g.rotation.y+=dt*8*(1-e);});
  const ba=t*.28;
  bird.position.set(Math.sin(ba)*7,5.4+Math.sin(t*1.7)*.35,Math.cos(ba)*7);
  bird.rotation.y=ba+Math.PI/2;
  wings[0].rotation.z=Math.sin(t*9)*.6;wings[1].rotation.z=-Math.sin(t*9)*.6;
  bGroup.rotation.z=Math.sin(t*2)*.03;
  bird.rotation.z=t-greetT<1?(t-greetT)*6.283:0;
  bub.visible=t-greetT<5;
  if(cheer.visible){const k=t-cheerT;cheer.position.y=4.5+k*.8;cheer.material.opacity=Math.max(0,1-k/4);if(k>4)cheer.visible=false;}
  place();R.render(S,cam);requestAnimationFrame(frame);
}
if(CLOUD){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
    firebase.auth().onAuthStateChanged(u=>{if(u)myUid=u.uid;});
    firebase.auth().signInAnonymously().catch(()=>toast('로그인에 실패했어요. Firebase 설정을 확인하세요'));
    let first=true;
    db.collection('letters').orderBy('createdAt').onSnapshot(snap=>{
      snap.docChanges().forEach(ch=>{
        const d=Object.assign({id:ch.doc.id},ch.doc.data());
        if(ch.type==='added'){if(!giftObjs.has(d.id)){gifts.push(d);addGift(d,!first);}}
        else if(ch.type==='modified'){
          const i=gifts.findIndex(q=>q.id===d.id);if(i>=0)gifts[i]=d;
          const o=giftObjs.get(d.id);if(o&&o!==dragG&&typeof d.x==='number'){o.position.x=d.x;o.position.z=d.z;}
        }else if(ch.type==='removed'){
          gifts=gifts.filter(q=>q.id!==d.id);
          const o=giftObjs.get(d.id);if(o){S.remove(o);giftObjs.delete(d.id);}
        }
      });
      first=false;setTop();
    },()=>toast('편지를 불러오지 못했어요'));
  }catch(e){toast('Firebase 설정을 확인하세요');}
}
setTop();frame();
</script>
